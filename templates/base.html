<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Estabelecimento | AgendaBot</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    
    <style>
        /* Configurações do Usuário (Injetadas via JS) */
        body.usuario-dark-mode {
            --bg-fundo: #121212 !important;
            --bg-card: #1e1e1e !important;
            --texto-escuro: #e0e0e0 !important;
            --cor-fundo-ativo: #2c2c2c !important; /* Fundo do item selecionado no menu fica cinza escuro */
        }
        
        /* Ocultar Boas Vindas */
        body.usuario-hide-welcome .saudacao-topo {
            display: none !important;
        }

        /* ========================================================= */
        /* VACINA CONTRA O BOOTSTRAP (FORÇAR ADAPTAÇÃO AO DARK MODE) */
        /* ========================================================= */

        /* 1. Remove os fundos brancos engessados dos cartões */
        .bg-white, .bg-light {
            background-color: var(--bg-card) !important;
        }

        /* 2. Força letras que estavam configuradas como "text-dark" a ficarem visíveis */
        .text-dark {
            color: var(--texto-escuro) !important;
        }

        /* 3. Estiliza os inputs e selects para não ficarem cinzas ou brancos estourados */
        .form-control, .form-select, .input-group-text {
            background-color: var(--bg-fundo) !important;
            color: var(--texto-escuro) !important;
            border: 1px solid var(--cor-fundo-ativo) !important;
        }
        
        .form-control:focus, .form-select:focus {
            background-color: var(--bg-fundo) !important;
            color: var(--texto-escuro) !important;
            border-color: var(--cor-primaria) !important;
            box-shadow: 0 0 0 0.2rem rgba(128, 128, 128, 0.1) !important;
        }

        /* 4. Tira a transparência e ajusta as tabelas */
        .table {
            color: var(--texto-escuro) !important;
            border-color: var(--cor-fundo-ativo) !important;
        }
        .table > :not(caption) > * > * {
            background-color: var(--bg-card) !important;
            color: var(--texto-escuro) !important;
        }

        /* 5. Transforma botões pretos ocultos (Ex: Salvar Regras) na cor do tema atual */
        .btn-dark {
            background-color: var(--cor-primaria) !important;
            color: #ffffff !important;
            border: none !important;
        }
        .btn-dark:hover {
            background-color: var(--cor-hover) !important;
            color: #ffffff !important;
        }

        /* ============================================== */
        /* DICIONÁRIO DE TEMAS (WHITE-LABEL DINÂMICO)     */
        /* ============================================== */

        /* TEMA 1: MANICURE (Padrão Original) */
        body.tema-manicure {
            --cor-primaria: #e87ba4;     
            --cor-hover: #d16b91;
            --cor-fundo-ativo: #ffe4ef;  
            --bg-fundo: #fff0f5;         
            --bg-card: #ffffff;
            --texto-escuro: #4a4a4a;   
            --texto-navbar: #e87ba4;
        }

        /* TEMA 2: BARBEARIA (Visual Dark / Dourado) */
        body.tema-barbearia {
            --cor-primaria: #b8860b;     
            --cor-hover: #daa520;
            --cor-fundo-ativo: #fdf5e6;  /* Dourado bem clarinho (Old Lace) */
            --bg-fundo: #f3f4f6;         /* Cinza claro elegante */
            --bg-card: #ffffff;          /* Cartões brancos */
            --texto-escuro: #333333;   
            --texto-navbar: #b8860b;
        }

        /* TEMA 3: TATUAGEM (Roxo) */
        body.tema-tatuagem {
            --cor-primaria: #8a2be2;     
            --cor-hover: #9370db;
            --cor-fundo-ativo: #f3e8fd;  /* Roxo bem clarinho */
            --bg-fundo: #f3f4f6;         /* Cinza claro elegante */
            --bg-card: #ffffff;          /* Cartões brancos */
            --texto-escuro: #333333;   
            --texto-navbar: #8a2be2;
        }

        /* ============================================== */
        /* APLICAÇÃO DINÂMICA DAS VARIÁVEIS               */
        /* ============================================== */

        body {
            background-color: var(--bg-fundo);
            color: var(--texto-escuro);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            transition: background-color 0.3s ease;
        }

        .card, .table {
            background-color: var(--bg-card) !important;
            color: var(--texto-escuro) !important;
            border: none;
        }

        .navbar-brand {
            font-weight: 800;
            color: var(--texto-navbar) !important; 
        }

        .content-area {
            padding: 15px;
            padding-bottom: 80px; 
        }

        /* Menu Lateral Estilizado Dinamicamente */
        .list-group-item {
            background-color: transparent;
            border-radius: 12px;
            margin-bottom: 5px;
            color: var(--texto-escuro);
            transition: all 0.2s ease-in-out;
            border: none;
        }
        
        .list-group-item:hover {
            background-color: var(--cor-fundo-ativo);
            color: var(--cor-primaria);
        }

        /* Item Ativo do Menu */
        .menu-ativo, .nav-link.active {
            background-color: var(--bg-card) !important;
            color: var(--cor-primaria) !important;
            font-weight: 700;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            border-left: 4px solid var(--cor-primaria) !important; 
        }

        /* Botão Primário Dinâmico */
        .btn-tema {
            background-color: var(--cor-primaria);
            color: #ffffff;
            font-weight: 500;
            border: none;
        }
        .btn-tema:hover {
            background-color: var(--cor-hover);
            color: #ffffff;
        }

        /* Estrutura do Offcanvas e Navbar */
        .navbar, .offcanvas, .offcanvas-header, .offcanvas-body {
            background-color: var(--bg-card) !important; 
            border-color: var(--bg-fundo) !important;
            color: var(--texto-escuro);
        }
        
        .nav-link { color: var(--texto-escuro); }
        .text-tema { color: var(--cor-primaria) !important; }
    </style>
</head>

<body class="tema-{{ session.get('nicho', 'manicure') }}">

    <nav class="navbar shadow-sm sticky-top">
        <div class="container-fluid">
            <button class="navbar-toggler border-0 px-1" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebarMenu">
                <span class="navbar-toggler-icon" style="filter: invert(var(--texto-escuro) == #e0e0e0 ? 1 : 0);"></span>
            </button>
            
            <a class="navbar-brand mx-auto" href="/">
                {% if session.get('logo') %}
                    <img src="{{ url_for('static', filename='uploads/' + session.get('logo')) }}" alt="Logo" style="height: 40px; max-width: 180px; object-fit: contain;">
                {% else %}
                    <i class="fa-solid fa-calendar-check text-tema"></i> {{ session.get('estabelecimento_nome', 'AgendaBot') }}
                {% endif %}
            </a>
            
            <div class="d-flex">
                <a href="#" class="nav-link" data-bs-toggle="modal" data-bs-target="#modalConfiguracoes">
                    <i class="fa-solid fa-circle-user fa-xl text-tema"></i>
                </a>
            </div>
        </div>
    </nav>

    <div class="offcanvas offcanvas-start" tabindex="-1" id="sidebarMenu" style="width: 280px;">
        <div class="offcanvas-header border-bottom">
            <h5 class="offcanvas-title text-tema"><i class="fa-solid fa-calendar-check"></i> Menu</h5>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
        </div>
        <div class="offcanvas-body">
            <div class="list-group list-group-flush">
                <a href="{{ url_for('dashboard') }}" class="list-group-item {% if request.endpoint == 'dashboard' %}menu-ativo{% endif %}">
                    <i class="fa-solid fa-chart-line me-2"></i> Dashboard
                </a>
                <a href="{{ url_for('agenda') }}" class="list-group-item {% if request.endpoint == 'agenda' %}menu-ativo{% endif %}">
                    <i class="fa-solid fa-calendar-days me-2"></i> Minha Agenda
                </a>
                <a href="{{ url_for('servicos') }}" class="list-group-item {% if request.endpoint == 'servicos' %}menu-ativo{% endif %}">
                    <i class="fa-solid fa-list me-2"></i> Meus Serviços
                </a>
                <a href="{{ url_for('pacotes') }}" class="list-group-item {% if request.endpoint == 'pacotes' %}menu-ativo{% endif %}">
                    <i class="fa-solid fa-gift me-2"></i> Combos / Pacotes
                </a>
                <a href="{{ url_for('clientes') }}" class="list-group-item {% if request.endpoint == 'clientes' %}menu-ativo{% endif %}">
                    <i class="fa-solid fa-users me-2"></i> Clientes
                </a>
                <a href="{{ url_for('horarios') }}" class="list-group-item {% if request.endpoint == 'horarios' %}menu-ativo{% endif %}">
                    <i class="fa-solid fa-clock me-2"></i> Meus Horários
                </a>
                <a href="{{ url_for('financeiro') }}" class="list-group-item {% if request.endpoint == 'financeiro' %}menu-ativo{% endif %}">
                    <i class="fa-solid fa-wallet me-2"></i> Financeiro
                </a>
                <a href="{{ url_for('meu_bot') }}" class="list-group-item {% if request.endpoint == 'meu_bot' %}menu-ativo{% endif %}">
                    <i class="fa-solid fa-robot fa-lg me-2 text-tema"></i> Meu Bot
                </a>
                <a href="{{ url_for('logout') }}" class="list-group-item mt-3 text-danger">
                    <i class="fa-solid fa-right-from-bracket me-2"></i> Sair
                </a>
            </div>
        </div>
    </div>

    <div class="modal fade" id="modalConfiguracoes" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered modal-sm">
            <div class="modal-content border-0 shadow">
                <div class="modal-header border-bottom-0 pb-0">
                    <h6 class="modal-title fw-bold text-dark"><i class="fa-solid fa-gear me-2"></i> Configurações</h6>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                
                <div class="modal-body">
                    <form action="{{ url_for('upload_logo') }}" method="POST" enctype="multipart/form-data" class="mb-3 border-bottom pb-3">
                        <label class="form-label small fw-bold text-muted mb-1">Upload da Logo</label>
                        <input type="file" name="logo_file" class="form-control form-control-sm mb-2" accept="image/png, image/jpeg" required>
                        <button type="submit" class="btn btn-sm btn-tema w-100 fw-bold">Salvar Imagem</button>
                    </form>

                    <label class="form-label small fw-bold text-muted mb-2">Preferências</label>
                    
                    <div class="form-check form-switch mb-2">
                        <input class="form-check-input" type="checkbox" id="toggleDarkMode">
                        <label class="form-check-label small text-dark" for="toggleDarkMode">Forçar Modo Escuro</label>
                    </div>
                    
                    <div class="form-check form-switch mb-3">
                        <input class="form-check-input" type="checkbox" id="toggleWelcome">
                        <label class="form-check-label small text-dark" for="toggleWelcome">Ocultar "Olá" no Início</label>
                    </div>

                    <button id="btnInstallApp" class="btn btn-sm btn-dark w-100 fw-bold" style="display: none;">
                        <i class="fa-solid fa-download me-2"></i> Instalar como Aplicativo
                    </button>
                </div>
            </div>
        </div>
    </div>



    <main class="content-area container-fluid">
        {% block content %}{% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
        // --- 1. LÓGICA DAS PREFERÊNCIAS VISUAIS ---
        const darkModeToggle = document.getElementById('toggleDarkMode');
        const welcomeToggle = document.getElementById('toggleWelcome');

        // Carrega o que o usuário salvou antes
        if (localStorage.getItem('pref_darkMode') === 'true') {
            document.body.classList.add('usuario-dark-mode');
            if(darkModeToggle) darkModeToggle.checked = true;
        }
        if (localStorage.getItem('pref_hideWelcome') === 'true') {
            document.body.classList.add('usuario-hide-welcome');
            if(welcomeToggle) welcomeToggle.checked = true;
        }

        // Salva quando o usuário clica no botão
        if(darkModeToggle) {
            darkModeToggle.addEventListener('change', (e) => {
                localStorage.setItem('pref_darkMode', e.target.checked);
                document.body.classList.toggle('usuario-dark-mode', e.target.checked);
            });
        }
        if(welcomeToggle) {
            welcomeToggle.addEventListener('change', (e) => {
                localStorage.setItem('pref_hideWelcome', e.target.checked);
                document.body.classList.toggle('usuario-hide-welcome', e.target.checked);
            });
        }

        // --- 2. LÓGICA DE INSTALAÇÃO DO APP (PWA) ---
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            // Impede que o navegador mostre o aviso padrão sozinho
            e.preventDefault();
            deferredPrompt = e;
            // Mostra o nosso botão dentro do modal de configurações
            const installBtn = document.getElementById('btnInstallApp');
            if(installBtn) installBtn.style.display = 'block';
        });

        document.getElementById('btnInstallApp').addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt(); // Mostra a tela de instalação do celular/chrome
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    document.getElementById('btnInstallApp').style.display = 'none';
                }
                deferredPrompt = null;
            }
        });
    </script>
</body>
</html>
