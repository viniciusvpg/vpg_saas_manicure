{% extends "base.html" %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4 mt-2">
    <h5 class="mb-0 fw-bold">Configuração de Horários</h5>
</div>

<div class="card border-0 shadow-sm rounded-4 p-3 p-md-4">
    <form action="{{ url_for('horarios') }}" method="POST">
        
        {% for i in range(7) %}
        {% set config = mapa_configs.get(i) %}
        
        <div class="row align-items-center mb-3 pb-3 border-bottom">
            
            <div class="col-12 col-md-3 mb-2 mb-md-0">
                <div class="form-check form-switch">
                    <input class="form-check-input" type="checkbox" role="switch" name="ativo_{{ i }}" id="ativo_{{ i }}" {% if not config or config.ativo %}checked{% endif %}>
                    <label class="form-check-label fw-bold ms-2 text-dark" for="ativo_{{ i }}">{{ dias_semana[i] }}</label>
                </div>
            </div>
            
            <div class="col-6 col-md-4">
                <label class="small text-muted fw-bold mb-1">Expediente</label>
                <div class="input-group input-group-sm">
                    <input type="time" class="form-control rounded-start-3" name="hora_inicio_{{ i }}" value="{{ config.hora_inicio if config else '08:00' }}">
                    <span class="input-group-text border-start-0 border-end-0 bg-light">até</span>
                    <input type="time" class="form-control rounded-end-3" name="hora_fim_{{ i }}" value="{{ config.hora_fim if config else '18:00' }}">
                </div>
            </div>
            
            <div class="col-6 col-md-5">
                <label class="small text-muted fw-bold mb-1">Almoço (Opcional)</label>
                <div class="input-group input-group-sm">
                    <input type="time" class="form-control rounded-start-3" name="almoco_inicio_{{ i }}" value="{{ config.almoco_inicio if config and config.almoco_inicio else '' }}">
                    <span class="input-group-text border-start-0 border-end-0 bg-light">até</span>
                    <input type="time" class="form-control rounded-end-3" name="almoco_fim_{{ i }}" value="{{ config.almoco_fim if config and config.almoco_fim else '' }}">
                </div>
            </div>
            
        </div>
        {% endfor %}
        
        <div class="text-end mt-4">
            <button type="submit" class="btn btn-dark rounded-pill px-5">Salvar Regras</button>
        </div>
    </form>
</div>
{% endblock %}
