<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | AgendaBot SaaS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            /* Fundo escuro e moderno para a tela de login */
            background: linear-gradient(135deg, #121212 0%, #1e1e1e 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .login-box {
            background-color: #ffffff;
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
        }
        .btn-saas {
            background-color: #10b981; /* Verde esmeralda tech */
            color: white;
            transition: all 0.3s;
        }
        .btn-saas:hover {
            background-color: #059669;
            color: white;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="login-box text-center">
        <!-- Título Neutro -->
        <h2 class="fw-bold mb-1 text-dark">
            <i class="fa-solid fa-calendar-check text-success"></i> AgendaBot
        </h2>
        <p class="text-muted mb-4 small">Gestão inteligente de agendamentos</p>

        <!-- Tratamento de Erros de Senha -->
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-danger py-2 small fw-bold">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <!-- Formulário Genérico -->
        <form method="POST">
            <div class="mb-3 text-start">
                <label class="form-label fw-bold small text-secondary">Telefone (WhatsApp)</label>
                <input type="text" name="telefone" class="form-control bg-light" placeholder="Ex: 47999999999" required>
            </div>
            
            <div class="mb-4 text-start">
                <label class="form-label fw-bold small text-secondary">Senha de Acesso</label>
                <input type="password" name="senha" class="form-control bg-light" placeholder="Digite sua senha" required>
            </div>
            
            <button type="submit" class="btn btn-saas w-100 py-2 fw-bold rounded-3">Acessar Painel</button>
        </form>
        
        <div class="mt-4 text-muted" style="font-size: 0.75rem;">
            Desenvolvido por <strong>VPG Soluções</strong> &copy; 2026
        </div>
    </div>

</body>
</html>
