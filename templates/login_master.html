<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8"><title>Master Access</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #0a0a0a; color: #deff9a; height: 100vh; display: flex; align-items: center; justify-content: center; font-family: 'Segoe UI', sans-serif; }
        .card { background: #161616; border: 1px solid rgba(222, 255, 154, 0.2); border-radius: 20px; width: 350px; padding: 30px; }
        .form-control { background: #0a0a0a; border: 1px solid #333; color: white; border-radius: 10px; }
        .btn-master { background: #deff9a; color: black; font-weight: bold; width: 100%; border-radius: 10px; }
    </style>
</head>
<body>
    <div class="card text-center">
        <h4 class="mb-4">Master Login</h4>
        <form method="POST">
            <input type="password" name="senha_master" class="form-control mb-3" placeholder="Chave Mestra" required>
            <button class="btn btn-master">Entrar no SaaS</button>
        </form>
    </div>
</body>
</html>
