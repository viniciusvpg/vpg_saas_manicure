<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VPG Master | Gestão SaaS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #050505;
            background-image: radial-gradient(circle at 50% -20%, #1a1a2e, #050505 80%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
        }
        .master-card {
            background: rgba(20, 20, 25, 0.6);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            width: 100%;
            max-width: 380px;
            padding: 40px 30px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center;
        }
        .icon-glow {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            box-shadow: 0 0 20px rgba(79, 172, 254, 0.4);
            color: #000;
            font-size: 24px;
        }
        .form-control {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            border-radius: 12px;
            padding: 12px 15px;
            text-align: center;
            letter-spacing: 2px;
            font-weight: 600;
        }
        .form-control:focus {
            background: rgba(0, 0, 0, 0.5);
            color: white;
            border-color: #4facfe;
            box-shadow: 0 0 0 0.25rem rgba(79, 172, 254, 0.25);
        }
        .form-control::placeholder { color: rgba(255, 255, 255, 0.3); letter-spacing: normal; font-weight: normal;}
        .btn-master {
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            color: #000;
            font-weight: 800;
            width: 100%;
            border-radius: 12px;
            padding: 12px;
            border: none;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }
        .btn-master:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(79, 172, 254, 0.3);
            color: #000;
        }
    </style>
</head>
<body>
    <div class="master-card">
        <div class="icon-glow">
            <i class="fa-solid fa-bolt"></i>
        </div>
        <h4 class="mb-1 text-white fw-bold">Acesso Master</h4>
        <p class="text-secondary small mb-4">VPG Soluções em Tecnologia</p>
        
        <form method="POST">
            <input type="password" name="senha_master" class="form-control mb-4" placeholder="••••••••" required>
            <button class="btn btn-master">Autenticar Sistema</button>
        </form>
    </div>
</body>
</html>
